name: ContractGuard tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          xargs -a packages.txt sudo apt-get install -y

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app.py analyzer.py auth.py evaluation.py playbooks.py prompts.py storage.py ui.py styles.py export_utils.py tests

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run report quality gate
        run: python -m evaluation evaluation_fixtures
